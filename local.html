<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta name='description' content='Imagem de uma região em Nova Zelandia em regiões montanhosas'>
    <meta name="author" content="Cassio Santos">
    <title>Nova Zelandia</title>
    <link rel='stylesheet' href='estilos/local.css'>
    <script src="scripts/local.js" defer></script>
</head>


<body>

    <header>
        <h1>Nova Zelandia</h1>

    </header>    
    <main>
    <div class="principal">
    <picture>
      <source srcset="imagens/imagem-grande.webp" media="(min-width: 1500px)">
      <source srcset="imagens/imagem-media.webp" media="(min-width: 1000px)">
      <img src="imagens/imagem-pequena.webp" alt="Imagem principal da Nova Zelandia">
    </picture>
    
    <section class="informacoes">
        <h2>Data</h2>
        <ul>
            <li><span>Área</span> 268.107 km²</li>
            <li><span>População</span> 5.084.300</li>
            <li><span>Capital</span> Wellington</li>
            <li><span>Idioma</span> Inglês</li>
            <li><span>Time Zone</span> UTC+12</li>
            <li><span>Calling Code</span> +64</li>
            <li><span>Internet</span> .nz</li>
        </ul>

    </section>  

    <section class="clima">
        <h2>Clima <span class="icone-clima-desktop" aria-hidden="true"></span></h2>
        <img src="imagens/clima.svg" alt="Ícone de clima parcialmente nublado" class="icone-clima-celular">
        <ul>
            <li><span>Temperatura</span> 8°C</li>
            <li><span>Condições</span> Parcialmente Nublado</li>
            <li><span>Sensação Térmica</span> <span id="sensacao-termica"></span></li>
        </ul>
    </section>
    </div>
    </main>
<footer>
    <p>© <span id="anoatual"></span> Cassio Santos</p>
    <p>Nova Zelandia</p>
    <p id="ultimaModificacao"></p>

</footer>
</body>

</html>
